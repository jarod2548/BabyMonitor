name: CI / Docker Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U BabyMonitor -d babymonitor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - uses: actions/checkout@v4

      - name: Wait for Postgres to be healthy
        run: |
            until [ "$(docker inspect --format='{{.State.Health.Status}}' $(docker ps -q --filter "ancestor=postgres:18"))" = "healthy" ]; do
              echo "Waiting for Postgres to be healthy..."
              sleep 2
            done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download backend dependencies
        run: mvn dependency:go-offline

      - name: Backend code analysis
        run: mvn checkstyle:check

      - name: Backend formatting check
        run: mvn spotless:check

      - name: Backend build and tests
        run: mvn clean verify

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: target/surefire-reports/

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: target/surefire-reports/

      # Docker steps only run on push to master, not PRs
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker build . --file Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/babymonitor:latest

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/babymonitor:latest
